<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 540" fill="none" aria-hidden="true">
  <g stroke="#1a1a18" stroke-linecap="round" stroke-linejoin="round">
    <!-- bowl -->
    <path d="M158 88 C158 58 262 58 262 88 L272 198 C276 258 302 318 210 392 C118 318 144 258 148 198 Z" stroke-width="2.2"/>
    <path d="M178 98 C178 74 242 74 242 98" stroke-width="1.5" opacity="0.5"/>

    <!-- wine fill -->
    <path d="M172 268 C168 300 182 328 210 348 C238 328 252 298 248 268 C230 255 190 255 172 268 Z" stroke-width="1.8" opacity="0.55"/>
    <path d="M185 290 C200 282 220 282 235 290" stroke-width="1.2" opacity="0.4"/>

    <!-- happy glass face -->
    <path d="M192 218 C196 224 204 224 208 218" stroke-width="1.3" opacity="0.55"/>
    <path d="M212 218 C216 224 224 224 228 218" stroke-width="1.3" opacity="0.55"/>
    <path d="M190 216 V217 M206 216 V217" stroke-width="1.2" opacity="0.45"/>
    <path d="M210 216 V217 M226 216 V217" stroke-width="1.2" opacity="0.45"/>
    <path d="M198 232 C206 240 218 240 226 232" stroke-width="1.4" opacity="0.5"/>

    <!-- bubbles -->
    <circle cx="218" cy="248" r="5" stroke-width="1.3" opacity="0.5"/>
    <circle cx="232" cy="228" r="4" stroke-width="1.2" opacity="0.45"/>
    <circle cx="242" cy="208" r="3" stroke-width="1.1" opacity="0.4"/>
    <circle cx="248" cy="190" r="2.5" stroke-width="1" opacity="0.35"/>
    <circle cx="195" cy="255" r="3.5" stroke-width="1.1" opacity="0.42"/>

    <!-- stem & base -->
    <path d="M210 392 L210 468" stroke-width="2.2"/>
    <path d="M172 468 L248 468" stroke-width="2.4"/>
    <ellipse cx="210" cy="472" rx="52" ry="9" stroke-width="1.7" opacity="0.75"/>

    <!-- tiny grape cluster -->
    <g transform="translate(95 320)">
      <circle cx="8" cy="8" r="6" stroke-width="1.4" opacity="0.55"/>
      <circle cx="20" cy="14" r="6" stroke-width="1.4" opacity="0.55"/>
      <circle cx="2" cy="18" r="5.5" stroke-width="1.3" opacity="0.5"/>
      <circle cx="14" cy="22" r="6" stroke-width="1.4" opacity="0.55"/>
      <path d="M18 0 C24 -8 32 -4 28 4" stroke-width="1.1" opacity="0.45"/>
      <ellipse cx="26" cy="-2" rx="6" ry="3.5" transform="rotate(-18 26 -2)" stroke-width="1" opacity="0.4"/>
    </g>

    <!-- cheeky wine swirl -->
    <path d="M168 155 C195 148 225 152 252 162" stroke-width="1.2" opacity="0.35"/>
    <path d="M165 188 C198 180 232 184 258 195" stroke-width="1.1" opacity="0.3"/>

    <!-- clink motion -->
    <path d="M72 240 C88 225 105 232 98 248" stroke-width="1.2" opacity="0.32" stroke-dasharray="4 6"/>
    <path d="M338 360 C322 345 305 352 312 365" stroke-width="1.1" opacity="0.28" stroke-dasharray="4 6"/>

    <path d="M188 128 L192 152 M228 126 L224 150" stroke-width="1" opacity="0.32"/>
