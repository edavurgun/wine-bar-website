<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" fill="none" aria-hidden="true">
  <g stroke="#1a1a18" stroke-linecap="round" stroke-linejoin="round">
    <!-- sharing plate — stacked, slightly tilted -->
    <g transform="rotate(-4 400 320)">
      <ellipse cx="400" cy="328" rx="168" ry="54" stroke-width="2.6"/>
      <ellipse cx="400" cy="318" rx="128" ry="40" stroke-width="1.7" opacity="0.55"/>
      <ellipse cx="400" cy="310" rx="78" ry="24" stroke-width="1.2" opacity="0.3"/>
      <!-- crumbs & goodies on plate -->
      <path d="M340 308 C352 298 368 312 358 322" stroke-width="1.4" opacity="0.5"/>
      <path d="M420 302 C438 292 452 308 442 318" stroke-width="1.3" opacity="0.48"/>
      <circle cx="378" cy="314" r="8" stroke-width="1.5" opacity="0.45"/>
      <circle cx="428" cy="318" r="6" stroke-width="1.3" opacity="0.4"/>
      <path d="M365 320 C372 328 385 326 392 318" stroke-width="1.2" opacity="0.38"/>
      <!-- sleepy plate face -->
      <path d="M382 308 C386 312 390 312 394 308" stroke-width="1" opacity="0.42"/>
      <path d="M380 306 V307 M392 306 V307" stroke-width="1.1" opacity="0.38"/>
    </g>

    <!-- bread chunk -->
    <path d="M268 268 C248 258 228 272 232 292 C236 308 258 318 278 308 C292 298 288 278 268 268 Z" stroke-width="2" opacity="0.7"/>
    <path d="M248 282 C258 278 268 285" stroke-width="0.9" opacity="0.35"/>

    <!-- wine glass (glasses to refill) -->
    <g transform="translate(520 120) rotate(8)">
      <path d="M0 0 L0 72" stroke-width="1.8"/>
      <path d="M-22 72 C-8 88 8 88 22 72" stroke-width="2"/>
      <path d="M-18 72 L18 72" stroke-width="1.6"/>
      <path d="M-14 0 C-20 28 -18 52 -8 68" stroke-width="1.3" opacity="0.4"/>
      <path d="M14 0 C20 28 18 52 8 68" stroke-width="1.3" opacity="0.4"/>
      <path d="M-6 40 C0 48 6 48" stroke-width="1" opacity="0.35"/>
      <path d="M0 88 L0 108" stroke-width="1.5"/>
      <ellipse cx="0" cy="112" rx="14" ry="4" stroke-width="1.4"/>
    </g>

    <!-- fork — leaning in, eager -->
    <g transform="rotate(6 175 380)">
      <path d="M175 500 L175 268" stroke-width="2.2"/>
      <path d="M175 268 L175 238" stroke-width="1.9"/>
      <path d="M158 238 C156 195 162 172 175 142" stroke-width="1.6"/>
      <path d="M166 238 C165 195 170 172 175 142" stroke-width="1.6"/>
      <path d="M175 238 C175 195 175 172 175 142" stroke-width="1.6"/>
      <path d="M184 238 C185 195 180 172 175 142" stroke-width="1.6"/>
      <path d="M192 238 C194 195 188 172 175 142" stroke-width="1.6"/>
      <path d="M152 238 L198 238" stroke-width="1.7" opacity="0.65"/>
      <path d="M162 500 L188 500" stroke-width="2.3"/>
      <ellipse cx="175" cy="506" rx="20" ry="6" stroke-width="1.5" opacity="0.6"/>
      <!-- waving motion -->
      <path d="M198 200 C212 188 222 192 214 204" stroke-width="1.2" opacity="0.45"/>
      <path d="M220 196 C228 184 238 188 232 198" stroke-width="1" opacity="0.38"/>
    </g>

    <!-- knife -->
    <g transform="rotate(-5 625 385)">
      <path d="M625 505 L625 308" stroke-width="2.2"/>
      <path d="M625 308 L625 278" stroke-width="1.8"/>
      <path d="M625 278 L625 158" stroke-width="2.1"/>
      <path d="M625 158 C582 202 568 255 576 308 L625 308" stroke-width="2.2"/>
      <path d="M625 205 C596 238 585 275 590 308" stroke-width="1.1" opacity="0.38"/>
      <path d="M608 505 L642 505" stroke-width="2.3"/>
      <ellipse cx="625" cy="511" rx="22" ry="6" stroke-width="1.5" opacity="0.6"/>
    </g>

    <!-- steam / aroma curls -->
    <path d="M350 220 C340 195 355 175 348 155" stroke-width="1.3" opacity="0.4"/>
    <path d="M368 215 C358 188 372 168 365 148" stroke-width="1.2" opacity="0.35"/>
    <path d="M430 210 C440 185 425 168 432 150" stroke-width="1.2" opacity="0.35"/>
    <path d="M448 218 C458 192 442 175 450 158" stroke-width="1.1" opacity="0.32"/>

    <!-- olive passing across -->
    <ellipse cx="295" cy="248" rx="10" ry="6" stroke-width="1.4" opacity="0.5" transform="rotate(-25 295 248)"/>
    <path d="M288 242 C282 235 278 238 282 245" stroke-width="1" opacity="0.4"/>

    <!-- motion: pass the plate -->
    <path d="M120 340 C145 325 165 335 155 352" stroke-width="1.2" opacity="0.32" stroke-dasharray="4 6"/>
    <path d="M680 360 C655 345 635 355 645 368" stroke-width="1.1" opacity="0.28" stroke-dasharray="4 6"/>
